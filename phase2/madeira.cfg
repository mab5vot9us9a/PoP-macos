# Madeira runtime config for Pagonia (read via MADEIRA_DOCS_DIR, see run_game.sh)
d3d12-tile-based = 0
capture-tess = 1
# session 4: clamp the terrain hull max factor (64 -> 8): -7 ms GPU/frame, no visible change in the menu
dtess-max-factor = 4
# session 4: depth-only (shadow map) tessellation pipelines get a lower clamp
dtess-depth-max-factor = 1
# diag-skip is re-read every 5 s: 1 plain, 2 gs-mesh, 4 dxil-tess, 8 dispatch, 16 tess depth-only, 32 tess colour (attribution only)
diag-skip = 0
